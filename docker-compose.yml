services:

  api:
    build: .
    container_name: multimodal-api
    ports:
      - "8000:8000"
    environment:
      # Tell the API to look for Qdrant on the Docker network
      - HF_TOKEN=${HF_TOKEN}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Optimize HuggingFace downloads in container
      - HF_HOME=/app/.cache/huggingface
    volumes:
      # Cache downloaded models so they persist across container restarts
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persist vector database data
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  hf_cache:
  qdrant_data:
