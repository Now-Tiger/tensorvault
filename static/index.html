<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <header class="mb-10 text-center">
        <h1 class="text-4xl font-bold text-indigo-600 mb-2">
          My Creator Vault
        </h1>
        <p class="text-gray-500">Multimodal AI Search System</p>
      </header>

      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8 flex items-center justify-between">
        <label class="font-semibold text-gray-700">Active Creator ID:</label>
        <input
          type="text"
          id="creatorId"
          value="test_user_123"
          class="border border-gray-300 rounded px-3 py-1 w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">1. Upload Asset</h2>
          <form id="uploadForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Select File (Image or Video)</label>
              <input
                type="file"
                id="assetFile"
                accept="image/*,video/*"
                required
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Caption / Context (Optional)</label>
              <textarea
                id="captionInput"
                rows="3"
                placeholder="What is happening in this asset?"
                class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              ></textarea>
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded hover:bg-indigo-700 transition"
            >
              Embed & Save to Vault
            </button>
          </form>
          <div id="uploadStatus" class="mt-4 text-sm font-medium hidden text-center"></div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">2. Search Vault</h2>
          <form id="searchForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Semantic Search Query</label>
              <input
                type="text"
                id="searchInput"
                placeholder="e.g., A cinematic video frame of guitar play"
                required
                class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-teal-600 text-white font-bold py-2 px-4 rounded hover:bg-teal-700 transition"
            >
              Search via AI
            </button>
          </form>
        </div>
      </div>

      <div class="mt-12">
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Search Results</h2>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <p class="text-gray-400 italic col-span-3 text-center py-10">
            Run a search to see AI retrievals.
          </p>
        </div>
      </div>
    </div>

    <script>
      // --- API INTEGRATION LOGIC ---

      // 1. Handle Smart Multi-Route Uploads
      document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById("uploadStatus");
        statusDiv.classList.remove("hidden", "text-green-600", "text-red-600");
        statusDiv.textContent = "Processing and computing vectors...";
        statusDiv.classList.add("text-blue-600", "block");

        const selectedFile = document.getElementById("assetFile").files[0];
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("creator_id", document.getElementById("creatorId").value);
        formData.append("file", selectedFile);

        const caption = document.getElementById("captionInput").value;
        if (caption) formData.append("caption", caption);

        // DETECT MODALITY ROUTE
        let targetEndpoint = "/upload/image/";
        if (selectedFile.type.startsWith("video/")) {
          targetEndpoint = "/upload/video/";
          statusDiv.textContent = "Chpping video timeline and executing batch frame inference...";
        }

        try {
          const response = await fetch(targetEndpoint, {
            method: "POST",
            body: formData,
          });
          const result = await response.json();

          if (response.ok) {
            statusDiv.textContent = result.message || "Success! Asset stored in Qdrant.";
            statusDiv.classList.replace("text-blue-600", "text-green-600");
            e.target.reset();
          } else {
            throw new Error(result.detail || "Processing run dropped by infrastructure backend.");
          }
        } catch (error) {
          statusDiv.textContent = `Error: ${error.message}`;
          statusDiv.classList.replace("text-blue-600", "text-red-600");
        }
      });

      // 2. Handle Searching & Adaptive Vector Previews
      document.getElementById("searchForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const grid = document.getElementById("resultsGrid");
        grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center">Searching multidimensional space...</p>';

        const query = document.getElementById("searchInput").value;
        const creatorId = document.getElementById("creatorId").value;

        try {
          const response = await fetch(
            `/query/?query=${encodeURIComponent(query)}&creator_id=${encodeURIComponent(creatorId)}&top_k=6`
          );
          const results = await response.json();
          grid.innerHTML = "";

          if (results.length === 0) {
            grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center">No matching assets found in vault.</p>';
            return;
          }

          results.forEach((res, index) => {
            // Check structural unpacking depending on standard endpoint signatures
            const asset = res.asset || res; 
            const score = res.score !== undefined ? res.score : 0.0;
            
            let mediaDisplay = "";

            if (asset.modality === "image") {
              mediaDisplay = `
                <div class="h-48 w-full bg-gray-200 overflow-hidden relative">
                  <img src="/${asset.content_uri}" alt="AI Result" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                </div>
              `;
            } else if (asset.modality === "video") {
              // Extract data coordinates added to payload schema definitions
              const timestamp = asset.metadata?.timestamp || 0;
              const thumbnail = asset.metadata?.thumbnail_uri || "";
              const videoId = `video_${index}`;

              mediaDisplay = `
                <div class="h-48 w-full bg-black relative group overflow-hidden">
                  <video id="${videoId}" src="/${asset.content_uri}#t=${timestamp}" controls class="w-full h-full object-cover hidden"></video>
                  
                  <div id="${videoId}_preview" class="w-full h-full relative cursor-pointer" onclick="playVideoAtTimestamp('${videoId}', ${timestamp})">
                    <img src="/${thumbnail}" alt="Frame checkpoint matching image" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300">
                    <div class="absolute inset-0 flex items-center justify-center">
                      <div class="bg-black/60 p-3 rounded-full text-white group-hover:bg-indigo-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
                        </svg>
                      </div>
                    </div>
                    <span class="absolute bottom-2 right-2 bg-black/70 text-white font-mono px-2 py-0.5 rounded text-xs">
                      Frame Match: ${timestamp}s
                    </span>
                  </div>
                </div>
              `;
            } else {
              mediaDisplay = `
                <div class="h-48 w-full bg-gray-100 flex items-center justify-center p-4 overflow-y-auto">
                  <p class="text-sm text-gray-700 italic">"${asset.content_uri}"</p>
                </div>
              `;
            }

            const card = `
              <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden flex flex-col">
                ${mediaDisplay} 
                <div class="p-4 flex-grow">
                  <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-gray-700">Rank #${index + 1}</span>
                    <span class="text-xs font-mono bg-indigo-100 text-indigo-800 px-2 py-1 rounded">Score: ${score.toFixed(4)}</span>
                  </div>
                  <p class="text-xs text-gray-500 uppercase tracking-wider mb-1 font-semibold">${asset.modality}</p>
                  ${asset.caption ? `<p class="text-sm text-gray-700 font-medium mb-2 line-clamp-2" title="${asset.caption}">${asset.caption}</p>` : ''}
                  <p class="text-xs text-gray-400 truncate" title="${asset.content_uri}">${asset.content_uri.split('/').pop()}</p>
                </div>
              </div>
            `;
            grid.insertAdjacentHTML("beforeend", card);
          });
        } catch (error) {
          grid.innerHTML = `<p class="text-red-500 col-span-3 text-center">Search Error: ${error.message}</p>`;
        }
      });

      // Interactive Click Handling Helper to seek into video frames
      function playVideoAtTimestamp(videoId, timestamp) {
        const videoElement = document.getElementById(videoId);
        const previewElement = document.getElementById(`${videoId}_preview`);
        
        if (videoElement && previewElement) {
          previewElement.classList.add("hidden");
          videoElement.classList.remove("hidden");
          videoElement.currentTime = timestamp;
          videoElement.play();
        }
      }
    </script>
  </body>
</html>
